<div [class]="'callout callout--' + tone()" [attr.role]="role()">
  <span class="callout__icon" aria-hidden="true">
    <svg
      [attr.data-icon]="icon()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @switch (tone()) {
        @case ('info') {
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        }
        @case ('success') {
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        }
        @case ('error') {
          <circle cx="12" cy="12" r="10" />
          <path d="m15 9-6 6" />
          <path d="m9 9 6 6" />
        }
        @case ('warning') {
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        }
      }
    </svg>
  </span>
  <div class="callout__content">
    @if (title(); as titleText) {
      <p class="callout__title">{{ titleText }}</p>
    }
    <div class="callout__body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
