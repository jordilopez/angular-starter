<dialog
  #dialog
  class="c-toast"
  [attr.data-variant]="variant()"
  [attr.role]="role()"
  [attr.aria-label]="ariaLabel()"
  (close)="onDialogClose($event)"
>
  <div class="content">
    <svg
      [attr.data-icon]="icon()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @switch (variant()) {
        @case ('info') {
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        }
        @case ('success') {
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        }
        @case ('error') {
          <circle cx="12" cy="12" r="10" />
          <path d="m15 9-6 6" />
          <path d="m9 9 6 6" />
        }
        @case ('warning') {
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z" />
          <path d="M12 9v4" />
          <path d="M12 17h.01" />
        }
      }
    </svg>
    <ng-content></ng-content>
  </div>
  <div class="close">
    <button type="button" aria-label="Close toast" (click)="onCloseClick()">
      <svg
        data-icon="close"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
  </div>
</dialog>
